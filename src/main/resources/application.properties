# ============================================================
# Datasource
# ============================================================

# File-based H2 database, created under ./data on first startup
spring.datasource.url=jdbc:h2:./data/configurationmanagerdb;FILE_LOCK=NO

# JDBC driver for the URL above
spring.datasource.driverClassName=org.h2.Driver

# Database user (the demo database has no password)
spring.datasource.username=sa

# Web console at http://localhost:8080/h2-console, to inspect the demo data
spring.h2.console.enabled=true

# Same connection, read by the AppJars license and configuration bootstrap
com.appjars.datasource.url=jdbc:h2:./data/configurationmanagerdb;FILE_LOCK=NO
com.appjars.datasource.username=sa
com.appjars.datasource.password=

# ============================================================
# JPA
# ============================================================

# Create and update the AppJar schema from the entity model
spring.jpa.hibernate.ddl-auto=update

# Set to true to log every SQL statement
spring.jpa.show-sql=false

# Pretty-print the logged SQL when show-sql is on
spring.jpa.properties.hibernate.format_sql=true

# Close the session at the end of the transaction, not at the end of the request
spring.jpa.open-in-view=false

# ============================================================
# Vaadin
# ============================================================

# Resolves the AppJar and demo message bundles for the Vaadin views
vaadin.i18n.provider=com.appjars.utils.i18n.AppjarsI18nProvider

# Use JDK interface proxies, which the AppJar service layer relies on
spring.aop.proxy-target-class=false

# ============================================================
# Configuration Manager
# ============================================================
# Every property the AppJar reads is listed below. The ones left commented out
# fall back to the default noted above them: an empty value would override it.

# Route of the System Configurations view
# Default: cfg/system
#com.appjars.configurationmanager.url.views.systemconfigurationsview=

# Route of the User Configurations view
# Default: cfg/user/list
#com.appjars.configurationmanager.url.views.usersconfigurationsview=

# Route of the My Configurations view
# Default: cfg/user/my-configs
#com.appjars.configurationmanager.url.views.myconfigurationsview=

# Date pattern of the filter date pickers in the configuration list views
# Default: dd-MM-yy
#com.appjars.configurationmanager.dateformat=

# Date and time pattern of the "Created" column in the configuration list views
# Default: dd-MM-yyyy HH:mm:ss
#com.appjars.configurationmanager.datetimeformat=

# Delay before the browser reloads after a restart, in milliseconds
# Default: 5000
#com.appjars.configurationmanager.restart.reloadDelayMillis=

# Shows the "Reload configuration" button, which restarts the Spring context.
# The demo needs it on; the AppJar default is false.
com.appjars.configurationmanager.restart.enabled=true
