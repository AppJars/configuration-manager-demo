# Home (public landing page)
appjars.configmanager.demo.home.title=Configuration Manager Demo
appjars.configmanager.demo.home.hero.title=Configuration Manager
appjars.configmanager.demo.home.hero.tagline=Store, version and resolve application configuration from a database (system-wide or per user), and read the system-wide values straight into your Spring beans as ordinary properties.
appjars.configmanager.demo.home.features.title=What''s inside
appjars.configmanager.demo.home.features.typed.title=Typed configurations
appjars.configmanager.demo.home.features.typed.desc=Manage String, Integer, Date, Time, Boolean and BigDecimal values, each with a type-aware editor.
appjars.configmanager.demo.home.features.scope.title=System-wide & per user
appjars.configmanager.demo.home.features.scope.desc=Two independent configuration scopes: system-wide configurations that apply to the whole application, and per-user configurations scoped to an individual user. Each is managed on its own, with its own value history.
appjars.configmanager.demo.home.features.history.title=History & restore
appjars.configmanager.demo.home.features.history.desc=Every value change is versioned: browse the history of any configuration and restore an earlier value.
appjars.configmanager.demo.home.features.resolution.title=Live vs. frozen
appjars.configmanager.demo.home.features.resolution.desc=Spring bean scope in action: a prototype-scoped bean re-resolves its @Value fields on every visit, while a singleton keeps the values injected once at startup. The Reload configuration button restarts the Spring application context (recreating the singletons) so the frozen values catch up, without restarting the JVM.
appjars.configmanager.demo.home.features.springvalue.title=Spring @Value integration
appjars.configmanager.demo.home.features.springvalue.desc=System configurations join the Spring environment as a property source, so they resolve straight into standard @Value injection; per-user values are read through the service API instead.
appjars.configmanager.demo.home.features.filtering.title=Filtering & search
appjars.configmanager.demo.home.features.filtering.desc=Find configurations by name, description, type and creation-date range.
appjars.configmanager.demo.home.features.responsive.title=Responsive UI
appjars.configmanager.demo.home.features.responsive.desc=Grids and filters adapt from desktop down to tablet and phone.
appjars.configmanager.demo.home.tryit.title=Try it now
appjars.configmanager.demo.home.tryit.intro=Pick a role on the login screen (no password needed). If you''re not logged in yet, opening a view or starting a guided tour first sends you to a fake login at /login. Each role sees a different set of views:
appjars.configmanager.demo.home.tryit.user=Read your own configuration values and the resolved system properties.
appjars.configmanager.demo.home.tryit.admin=Everything USER can do, plus managing system-wide and per-user configurations.
appjars.configmanager.demo.home.tryit.myconfigs=My configurations
appjars.configmanager.demo.home.tryit.current=Current configurations (admin)
appjars.configmanager.demo.home.tryit.system=System configurations (admin)
appjars.configmanager.demo.home.tryit.users=User configurations (admin)
appjars.configmanager.demo.home.tryit.adminhint=The views marked (admin) are restricted to the ADMIN role: log in as administrator to open them, or you''ll land on an access-denied page.
appjars.configmanager.demo.home.tour.button=Guided tour
appjars.configmanager.demo.home.tour.thispage=This page
appjars.configmanager.demo.home.tour.myconfigs=My configurations
appjars.configmanager.demo.home.tour.current=Current configurations (administration)
appjars.configmanager.demo.home.tour.system=System configurations (administration)
appjars.configmanager.demo.home.tour.users=User configurations (administration)
appjars.configmanager.demo.home.license.title=Free vs. full license
appjars.configmanager.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 5 configurations you create (the preloaded examples don''t count toward the limit). A full license removes the limit, and nothing else changes.
appjars.configmanager.demo.home.license.link=Get a license at appjars.com
appjars.configmanager.demo.home.links.title=Learn more
appjars.configmanager.demo.home.links.github=AppJars on GitHub
appjars.configmanager.demo.home.links.readme=Configuration Manager documentation

# Guided tours
appjars.configmanager.demo.tour.btn.next=Next
appjars.configmanager.demo.tour.btn.back=Back
appjars.configmanager.demo.tour.btn.done=Done
appjars.configmanager.demo.tour.canceled.modal=The tour ended because a dialog was opened. Close the dialog and start the tour again from the Tour menu.
appjars.configmanager.demo.tour.system.intro.title=System configurations
appjars.configmanager.demo.tour.system.intro.desc=These are the configurations that apply to the whole application. This short tour walks you through the grid, the filters and what you can do with each configuration.
appjars.configmanager.demo.tour.system.grid.title=System configurations
appjars.configmanager.demo.tour.system.grid.desc=Every system-wide configuration, with its name, description, type and current value.
appjars.configmanager.demo.tour.system.filters.title=Filter the list
appjars.configmanager.demo.tour.system.filters.desc=Narrow the grid by name, description, type or creation-date range.
appjars.configmanager.demo.tour.system.new.title=Create a configuration
appjars.configmanager.demo.tour.system.new.desc=Add a new system configuration, choosing its type and default value in a type-aware editor.
appjars.configmanager.demo.tour.system.reload.title=Reload configuration
appjars.configmanager.demo.tour.system.reload.desc=Restarts the Spring application context right from the UI: closing and re-running it recreates every singleton against the current values and drops active sessions. Use it so singleton-injected @Value fields pick up configuration changes, without restarting the JVM.
appjars.configmanager.demo.tour.system.actions.title=Per-row actions
appjars.configmanager.demo.tour.system.actions.desc=Every row has this menu, opened here so you can see it: edit the value, browse and restore its history, reset it to the default, edit the configuration itself or delete it.
appjars.configmanager.demo.tour.system.license.title=Free-tier limit
appjars.configmanager.demo.tour.system.license.desc=In free mode you can create up to 5 configurations; the preloaded examples don''t count. A full license removes the limit.

appjars.configmanager.demo.tour.users.intro.title=User configurations
appjars.configmanager.demo.tour.users.intro.desc=The administration view over per-user configurations: pick a user and manage the values that apply to them.
appjars.configmanager.demo.tour.users.user.title=Pick a user
appjars.configmanager.demo.tour.users.user.desc=This picker decides whose configurations you see; the rest of the view stays disabled until one is chosen, so the tour picked the first user for you. Switch users at any time and the grid reloads with the values that apply to them.
appjars.configmanager.demo.tour.users.grid.title=Per-user configurations
appjars.configmanager.demo.tour.users.grid.desc=Every user configuration, with its type and the value that currently applies to the selected user: their own value, or the default when they haven''t set one.
appjars.configmanager.demo.tour.users.filters.title=Filter the list
appjars.configmanager.demo.tour.users.filters.desc=Narrow the grid by name, description, type or creation-date range.
appjars.configmanager.demo.tour.users.new.title=Create a configuration
appjars.configmanager.demo.tour.users.new.desc=Add a new user configuration, choosing its type and default value in a type-aware editor.
appjars.configmanager.demo.tour.users.actions.title=Per-row actions
appjars.configmanager.demo.tour.users.actions.desc=Every row has this menu, opened here so you can see it: set the selected user''s value, browse and restore its history, reset it to the default, edit the configuration itself or delete it.
appjars.configmanager.demo.tour.users.finish.title=See it resolved
appjars.configmanager.demo.tour.users.finish.desc=Open Current Configurations and look at the User Properties section: it resolves these values per user through the service API: pick a user, load their properties, and you get their own value or the configuration default. Unlike system configurations, per-user values are not exposed to Spring''s @Value.

appjars.configmanager.demo.tour.my.intro.title=My configurations
appjars.configmanager.demo.tour.my.intro.desc=Your own configuration values, the self-service side of the appjar. Administration actions are hidden here: you only manage what applies to you.
appjars.configmanager.demo.tour.my.grid.title=Your configurations
appjars.configmanager.demo.tour.my.grid.desc=The configurations resolved for the logged-in user, with the value that currently applies to you.
appjars.configmanager.demo.tour.my.value.title=Your value or the default
appjars.configmanager.demo.tour.my.value.desc=The Value column shows your own value, or the configuration''s default value (marked as such) when you haven''t set one for yourself.
appjars.configmanager.demo.tour.my.filters.title=Filter the list
appjars.configmanager.demo.tour.my.filters.desc=Narrow the grid by name, description, type or creation-date range.
appjars.configmanager.demo.tour.my.actions.title=Manage your values
appjars.configmanager.demo.tour.my.actions.desc=Every row has this menu, opened here so you can see it: set your own value, browse and restore its history, or reset it to the configuration default. The administration entries are hidden in this view.
appjars.configmanager.demo.tour.my.finish.title=Want to manage more?
appjars.configmanager.demo.tour.my.finish.desc=Log in as ADMIN to manage system-wide configurations and other users'' values.

appjars.configmanager.demo.tour.current.intro.title=How configurations reach your code
appjars.configmanager.demo.tour.current.intro.desc=Both configuration scopes are resolved on this page, each through its own mechanism. System configurations join the Spring environment as a property source, so they arrive through standard @Value injection, and when a change takes effect depends on the scope of the bean that reads it, as the two columns below show. User configurations are not part of the environment: they are resolved per user through the service API, in the User Properties section further down.
appjars.configmanager.demo.tour.current.live.title=Live values
appjars.configmanager.demo.tour.current.live.desc=This view is prototype-scoped, so its @Value fields are re-resolved on every navigation. Change a system configuration and come back: these fields already show the new value.
appjars.configmanager.demo.tour.current.frozen.title=Frozen values
appjars.configmanager.demo.tour.current.frozen.desc=The same properties injected once into a singleton bean at startup. They keep the value they were given, no matter how many times you edit the configuration, which is exactly what happens to a real singleton service.
appjars.configmanager.demo.tour.current.reload.title=Making the frozen values catch up
appjars.configmanager.demo.tour.current.reload.desc=Use "Reload configuration" in System Configurations: it restarts the Spring application context, recreating every singleton against the current values, without restarting the JVM. Come back here and the frozen column is up to date.
appjars.configmanager.demo.tour.current.user.title=Per-user resolution
appjars.configmanager.demo.tour.current.user.desc=User configurations resolve per user through the service API. Pick a user and load their properties to see the values that apply to them, falling back to each configuration''s default.
appjars.configmanager.demo.tour.current.finish.title=Try it end to end
appjars.configmanager.demo.tour.current.finish.desc=For a system configuration: edit its value in System Configurations, come back here and compare the live and frozen columns; then use Reload configuration and watch the frozen column catch up. For a user configuration: set a value for a user in User Configurations (or your own in My Configurations), come back, pick that user above and load their properties: the User Properties section shows their value, and the configuration default for everyone else.
